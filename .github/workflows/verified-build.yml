name: Verified Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verified-build:
    name: Verified Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install solana-verify
        run: |
          cargo install \
            --git https://github.com/solana-foundation/solana-verifiable-build \
            --tag v0.4.12 \
            solana-verify \
            --force

      - name: Run verified-build lane
        run: ./scripts/run-verified-build.sh

      - name: Upload verified-build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-build-artifacts
          path: |
            artifacts/verified-build/*.json
            target/deploy/migrator.so
