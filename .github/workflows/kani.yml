name: Kani

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Kani Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: 0.67.0
          command: cargo-kani
          working-directory: .

      - name: Run repo Kani lane
        run: ./scripts/run-kani-lane.sh
