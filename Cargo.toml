[workspace]
members = ["programs/migrator-program"]
resolver = "2"

[workspace.metadata.cli]
solana = "2.3.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-log = "0.5.0"
pinocchio-system = "0.5.0"
pinocchio-token = "0.5.0"
solana-address = { version = "2.4.0", features = ["curve25519"] }
